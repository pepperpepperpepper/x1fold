# X1 Fold: leave more headroom before the critical-battery action fires.
#
# Stock Arch defaults are PercentageCritical=5 / PercentageAction=2. Two percent
# is very thin on this machine, and it matters more than usual here because the
# lid-close policy is hibernate (see systemd/logind.conf.d/) and because a
# handle-lid-switch inhibitor (scripts/x1fold-stay-awake) keeps the machine
# awake and folded with no lid-driven sleep at all. In that state UPower's
# threshold is the only thing standing between a long-running job and a hard
# power loss.
#
# Ordering constraint: PercentageLow > PercentageCritical > PercentageAction.
#
# CriticalPowerAction is deliberately left at the stock "Auto". Auto prefers
# hibernate and falls back to power-off when resume is not configured, which is
# the right behaviour on a freshly imaged machine that has no working swap yet.
# Pinning it to Hibernate here would be a footgun on transfer.

[UPower]
PercentageLow=20.0
PercentageCritical=10.0
PercentageAction=5.0
