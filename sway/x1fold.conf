# X1 Fold: Sway-side lid (fold) handling.
#
# Installed by scripts/install_x1fold_sway.sh. This file is repo-managed and is
# overwritten on reinstall -- put hand edits in ~/.config/sway/config.user
# instead, which nothing in this repo touches.

# Blank the internal panel when the fold closes, restore it when it opens.
#
# `dpms off` rather than `output eDP-1 disable`: disabling destroys the output,
# and on re-enable the halfblank UI re-applies geometry/transform, which fights
# the layer-shell blanking for no benefit. dpms just powers the panel down --
# the same win on OLED.
#
# Only eDP-1, deliberately: when docked to an external display you want that
# display to stay up while the Fold itself is closed.
#
# bindswitch reads the libinput switch directly, so this fires whether or not
# logind is handling the lid -- including while x1fold-stay-awake holds a
# handle-lid-switch inhibitor. That is the intended behaviour: screen off
# either way.
bindswitch --reload --locked lid:on  output eDP-1 dpms off
bindswitch --reload --locked lid:off output eDP-1 dpms on
