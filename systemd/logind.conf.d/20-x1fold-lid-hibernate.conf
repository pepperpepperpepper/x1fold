[Login]
# X1 Fold: prefer true "cold" sleep on lid close (S4 hibernate).
# Note: this is separate from suspend (s2idle) which can run warm.
HandleLidSwitch=hibernate
HandleLidSwitchExternalPower=hibernate
HandleLidSwitchDocked=hibernate
# Ensure lid close still works even if apps hold a sleep inhibitor.
LidSwitchIgnoreInhibited=yes

# REQUIRES the kernel cmdline argument `button.lid_init_state=open`.
#
# Without it, `button.lid_init_state` defaults to `method`: on resume the ACPI
# button driver re-evaluates `_LID` and sets SW_LID from the result. On this
# machine that comes back *closed*. logind ignores lid input for
# HoldoffTimeoutSec (30s) after resume, then re-reads the switch state directly
# -- sees "closed" -- and applies HandleLidSwitch again. The machine hibernates
# itself roughly 23-26s after you open it, with no `Lid closed.` ever logged.
#
# That lands almost exactly when resume finishes (the Bluetooth keyboard
# re-attaches around +25s), so it reads as "it woke up and then died again".
#
# scripts/install_x1fold_sleep.sh installs this file and patches the cmdline.
